services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-agentguard-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-agentguard}"
      MYSQL_USER: "${MYSQL_USER:-agentguard}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-agentguard}"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - agentguard_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentguard:latest
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "${AGENTGUARD_PORT:-38080}:38080"
    environment:
      AGENTGUARD_HOST: 0.0.0.0
      AGENTGUARD_PORT: 38080
      AGENTGUARD_API_KEY: "${AGENTGUARD_API_KEY:-sk-agentguard-backend-X9m42Vq7Tz8nL3pA6cR0yH5uJ1sWfKdE}"
      AGENTGUARD_SERVER_PLUGIN_CONFIG: "${AGENTGUARD_SERVER_PLUGIN_CONFIG:-}"
      AGENTGUARD_POLICY: "${AGENTGUARD_POLICY:-}"
      AGENTGUARD_MYSQL_URL: "${AGENTGUARD_MYSQL_URL:-mysql://${MYSQL_USER:-agentguard}:${MYSQL_PASSWORD:-agentguard}@mysql:3306/${MYSQL_DATABASE:-agentguard}}"
      AGENTGUARD_USER_SESSION_TTL_SECONDS: "${AGENTGUARD_USER_SESSION_TTL_SECONDS:-86400}"
      AGENTGUARD_USER_TICKET_TTL_SECONDS: "${AGENTGUARD_USER_TICKET_TTL_SECONDS:-300}"
      AGENTGUARD_USER_EMAIL_CODE_TTL_SECONDS: "${AGENTGUARD_USER_EMAIL_CODE_TTL_SECONDS:-600}"
      AGENTGUARD_USER_EMAIL_CODE_COOLDOWN_SECONDS: "${AGENTGUARD_USER_EMAIL_CODE_COOLDOWN_SECONDS:-60}"
      AGENTGUARD_USER_EMAIL_CODE_MAX_ATTEMPTS: "${AGENTGUARD_USER_EMAIL_CODE_MAX_ATTEMPTS:-5}"
      AGENTGUARD_SMTP_HOST: "${AGENTGUARD_SMTP_HOST:-}"
      AGENTGUARD_SMTP_PORT: "${AGENTGUARD_SMTP_PORT:-587}"
      AGENTGUARD_SMTP_USERNAME: "${AGENTGUARD_SMTP_USERNAME:-}"
      AGENTGUARD_SMTP_PASSWORD: "${AGENTGUARD_SMTP_PASSWORD:-}"
      AGENTGUARD_SMTP_FROM: "${AGENTGUARD_SMTP_FROM:-}"
      AGENTGUARD_SMTP_USE_TLS: "${AGENTGUARD_SMTP_USE_TLS:-true}"
      AGENTGUARD_LLM_BASE_URL: "${AGENTGUARD_LLM_BASE_URL:-}"
      AGENTGUARD_LLM_MODEL: "${AGENTGUARD_LLM_MODEL:-}"
      AGENTGUARD_LLM_API_KEY: "${AGENTGUARD_LLM_API_KEY:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-Api-Key: $$AGENTGUARD_API_KEY\" http://127.0.0.1:38080/v1/backend/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentguard:latest
    command: ["frontend"]
    restart: unless-stopped
    ports:
      - "${AGENTGUARD_FRONTEND_PORT:-38008}:38008"
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: 38008
      AGENTGUARD_API_BASE: http://server:38080
      AGENTGUARD_API_KEY: "${AGENTGUARD_API_KEY:-sk-agentguard-backend-X9m42Vq7Tz8nL3pA6cR0yH5uJ1sWfKdE}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:38008/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      server:
        condition: service_healthy

  # E2E verifier. Enable with: docker compose --profile e2e up --abort-on-container-exit
  client:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentguard:latest
    command: ["client"]
    profiles: ["e2e"]
    depends_on:
      server:
        condition: service_healthy
    environment:
      AGENTGUARD_SERVER_URL: http://server:38080

volumes:
  agentguard_mysql:
