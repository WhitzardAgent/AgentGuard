<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentGuard Frontend Preview</title>
  <script src="/static/common/i18n.js"></script>
  <link rel="stylesheet" href="/static/common/styles.css">
</head>
<body>
  <div class="app-shell">
{{ shared:sidebar }}

    <main class="app-main home-main">
      <section class="page-intro-card home-hero">
        <div class="home-hero-copy">
          <p class="page-kicker">User Studio</p>
          <h1><span class="home-hero-name">User Centre</span></h1>
          <p class="subtle">
            Manage your personal information and settings on this page.
          </p>
        </div>
      </section>

      <div id="agentguard-page-context" hidden>
        <span id="agentguard-page-context-title">User Centre</span>
        <span id="agentguard-page-context-description">Manage frontend user identities and related configuration.</span>
      </div>

      <section class="grid two">
        <div class="card" id="profile-card">
          <div class="heading-row">
            <h3>Current User</h3>
            <div class="profile-actions">
              <button class="btn primary" id="generate-ticket-button" type="button" hidden>Generate Ticket</button>
              <button class="btn" id="logout-button" type="button" hidden>Logout</button>
            </div>
          </div>
          <p class="subtle" id="user-status">Checking sign-in status...</p>
        </div>

        <div class="card" id="password-card" hidden>
          <div class="heading-row">
            <h3>Change Password</h3>
          </div>
          <form class="form-grid" id="password-change-form">
            <label>
              <span>Current Password</span>
              <input id="current-password" type="password" autocomplete="current-password" required>
            </label>
            <label>
              <span>New Password</span>
              <input id="new-password" type="password" autocomplete="new-password" required minlength="8">
            </label>
            <label>
              <span>Confirm New Password</span>
              <input id="confirm-new-password" type="password" autocomplete="new-password" required minlength="8">
            </label>
            <div class="form-grid-actions">
              <button class="btn primary" type="submit">Update Password</button>
            </div>
          </form>
        </div>

        <div class="card" id="external-account-card" hidden>
          <div class="heading-row">
            <h3>External Accounts</h3>
          </div>
          <form class="form-grid" id="dify-bind-form">
            <label>
              <span>Dify Email</span>
              <input id="dify-email" type="email" autocomplete="email" required maxlength="255">
            </label>
            <label>
              <span>Display Name</span>
              <input id="dify-display-name" maxlength="255">
            </label>
            <div class="form-grid-actions">
              <button class="btn primary" type="submit">Bind Dify</button>
            </div>
          </form>
          <form class="form-grid external-account-form" id="n8n-bind-form">
            <label>
              <span>n8n Email</span>
              <input id="n8n-email" type="email" autocomplete="email" required maxlength="255">
            </label>
            <div class="form-grid-actions">
              <button class="btn primary" type="submit">Bind n8n</button>
            </div>
          </form>
          <div class="table-card" id="external-account-list-card" hidden>
            <table>
              <thead>
                <tr>
                  <th>Provider</th>
                  <th>Email</th>
                  <th>Name</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="external-account-list"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast"></div>
    <div class="ticket-modal-backdrop" id="ticket-modal-backdrop" hidden>
      <section class="ticket-modal" role="dialog" aria-modal="true" aria-labelledby="ticket-modal-title">
        <div class="heading-row">
          <h3 id="ticket-modal-title">LangChain Ticket</h3>
          <button class="btn" id="close-ticket-modal-button" type="button">Close</button>
        </div>
        <label class="ticket-field">
          <span>Ticket</span>
          <input id="ticket-value" readonly spellcheck="false">
        </label>
        <p class="subtle" id="ticket-expiry"></p>
        <div class="form-grid-actions">
          <button class="btn primary" id="copy-ticket-button" type="button">Copy Ticket</button>
        </div>
      </section>
    </div>
  </div>

  <script src="/static/common/messages.js"></script>
  <script src="/static/common/page-shell.js"></script>
  <script>
    (function () {
      const logoutButton = document.getElementById("logout-button");
      const generateTicketButton = document.getElementById("generate-ticket-button");
      const statusNode = document.getElementById("user-status");
      const passwordCard = document.getElementById("password-card");
      const passwordChangeForm = document.getElementById("password-change-form");
      const externalAccountCard = document.getElementById("external-account-card");
      const difyBindForm = document.getElementById("dify-bind-form");
      const n8nBindForm = document.getElementById("n8n-bind-form");
      const externalAccountListCard = document.getElementById("external-account-list-card");
      const externalAccountList = document.getElementById("external-account-list");
      const ticketModalBackdrop = document.getElementById("ticket-modal-backdrop");
      const ticketValue = document.getElementById("ticket-value");
      const ticketExpiry = document.getElementById("ticket-expiry");
      const copyTicketButton = document.getElementById("copy-ticket-button");
      const closeTicketModalButton = document.getElementById("close-ticket-modal-button");
      let activeTicket = "";

      function showToast(message, tone) {
        const toast = document.getElementById("toast");
        if (!toast) {
          return;
        }
        toast.textContent = message;
        toast.className = `toast ${tone || "success"} show`;
        window.setTimeout(() => toast.classList.remove("show"), 2600);
      }

      async function api(path, options) {
        const response = await fetch(path, {
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.detail || payload.error || `HTTP ${response.status}`);
        }
        return payload;
      }

      function updateShellUser(user) {
        const label = user ? user.username : "";
        window.AgentGuardShell?.setCurrentUser?.(label);
      }

      function clearCatalogCaches() {
        window.AgentGuardToolData?.clearAllCatalogCaches?.();
        [
          "agentguard.agentCatalog",
          "agentguard.agentCatalogSyncedAt",
          "agentguard.scopedAgentId",
          "agentguard.scopedToolCatalog",
          "agentguard.scopedToolCatalogSyncedAt",
          "agentguard.scopedSkillList",
          "agentguard.scopedSkillListSyncedAt",
          "agentguard.scopedMcpList",
          "agentguard.scopedMcpListSyncedAt",
          "agentguard.scopedRuleList",
          "agentguard.scopedRuleListSyncedAt",
          "agentguard.toolCatalog",
          "agentguard.toolCatalogSyncedAt",
        ].forEach((key) => localStorage.removeItem(key));
      }

      function renderUser(user) {
        const signedIn = Boolean(user);
        const emailLabel = user?.email
          ? ` Email: ${user.email}${user.email_verified ? "" : " (unverified)"}.`
          : " Email: not bound.";
        statusNode.textContent = signedIn
          ? `Signed in as ${user.username} (user #${user.id}).${emailLabel}`
          : "Not signed in.";
        logoutButton.hidden = !signedIn;
        generateTicketButton.hidden = !signedIn;
        passwordCard.hidden = !signedIn;
        externalAccountCard.hidden = !signedIn;
        if (!signedIn) {
          passwordChangeForm.reset();
          difyBindForm.reset();
          n8nBindForm.reset();
          externalAccountListCard.hidden = true;
          externalAccountList.innerHTML = "";
          closeTicketModal();
          clearCatalogCaches();
        }
        updateShellUser(user);
      }

      function renderExternalAccounts(accounts) {
        if (!accounts.length) {
          externalAccountListCard.hidden = true;
          externalAccountList.innerHTML = "";
          return;
        }
        externalAccountListCard.hidden = false;
        externalAccountList.innerHTML = accounts.map((account) => `
          <tr>
            <td>${escapeHtml(account.provider || "")}</td>
            <td>${escapeHtml(account.account_email || "")}</td>
            <td>${escapeHtml(account.display_name || "-")}</td>
            <td>
              <button class="btn" type="button" data-external-account-id="${escapeHtml(account.id || "")}">
                Unbind
              </button>
            </td>
          </tr>
        `).join("");
      }

      function providerLabel(provider) {
        const normalized = String(provider || "").toLowerCase();
        if (normalized === "n8n") {
          return "n8n";
        }
        if (normalized === "dify") {
          return "Dify";
        }
        return provider || "External";
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      async function refresh() {
        try {
          const payload = await api("/api/user/me");
          renderUser(payload.user);
          const externalPayload = await api("/api/user/external-accounts");
          renderExternalAccounts(externalPayload.external_accounts || []);
        } catch {
          renderUser(null);
          const next = encodeURIComponent(`${window.location.pathname}${window.location.search || ""}`);
          window.location.replace(`/login.html?next=${next}`);
        }
      }

      function openTicketModal(payload) {
        activeTicket = String(payload.ticket || "");
        ticketValue.value = activeTicket;
        ticketExpiry.textContent = payload.ttl_seconds
          ? `Expires in ${payload.ttl_seconds} seconds.`
          : "This ticket is short-lived.";
        ticketModalBackdrop.hidden = false;
        ticketValue.focus();
        ticketValue.select();
      }

      function closeTicketModal() {
        activeTicket = "";
        ticketValue.value = "";
        ticketExpiry.textContent = "";
        ticketModalBackdrop.hidden = true;
      }

      async function copyText(value) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
          return;
        }
        ticketValue.focus();
        ticketValue.select();
        document.execCommand("copy");
      }

      generateTicketButton.addEventListener("click", async () => {
        generateTicketButton.disabled = true;
        try {
          const payload = await api("/api/user/tickets", {
            method: "POST",
            body: "{}",
          });
          openTicketModal(payload);
        } catch (error) {
          showToast(error.message || "Failed to generate ticket.", "warning");
        } finally {
          generateTicketButton.disabled = false;
        }
      });

      copyTicketButton.addEventListener("click", async () => {
        if (!activeTicket) {
          closeTicketModal();
          return;
        }
        try {
          await copyText(activeTicket);
          closeTicketModal();
          showToast("Ticket copied.", "success");
        } catch (error) {
          showToast(error.message || "Failed to copy ticket.", "warning");
        }
      });

      closeTicketModalButton.addEventListener("click", closeTicketModal);

      ticketModalBackdrop.addEventListener("click", (event) => {
        if (event.target === ticketModalBackdrop) {
          closeTicketModal();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !ticketModalBackdrop.hidden) {
          closeTicketModal();
        }
      });

      logoutButton.addEventListener("click", async () => {
        try {
          await api("/api/user/logout", { method: "POST", body: "{}" });
        } catch {
          // Continue local logout even if the session is already gone.
        }
        renderUser(null);
        showToast("Signed out.", "success");
        window.setTimeout(() => window.location.replace("/login.html"), 300);
      });

      passwordChangeForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const currentPassword = document.getElementById("current-password").value;
        const newPassword = document.getElementById("new-password").value;
        const confirmPassword = document.getElementById("confirm-new-password").value;
        if (newPassword !== confirmPassword) {
          showToast("New passwords do not match.", "warning");
          return;
        }
        try {
          await api("/api/user/password", {
            method: "POST",
            body: JSON.stringify({
              current_password: currentPassword,
              new_password: newPassword,
            }),
          });
          passwordChangeForm.reset();
          showToast("Password updated.", "success");
        } catch (error) {
          showToast(error.message || "Failed to update password.", "warning");
        }
      });

      async function bindExternalAccount(provider, emailInputId, displayNameInputId, form) {
        const label = providerLabel(provider);
        try {
          await api("/api/user/external-accounts", {
            method: "POST",
            body: JSON.stringify({
              provider,
              email: document.getElementById(emailInputId).value.trim(),
              display_name: displayNameInputId
                ? document.getElementById(displayNameInputId).value.trim() || null
                : null,
            }),
          });
          form.reset();
          await refresh();
          showToast(`${label} account bound.`, "success");
        } catch (error) {
          showToast(error.message || `Failed to bind ${label} account.`, "warning");
        }
      }

      difyBindForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        await bindExternalAccount("dify", "dify-email", "dify-display-name", difyBindForm);
      });

      n8nBindForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        await bindExternalAccount("n8n", "n8n-email", null, n8nBindForm);
      });

      externalAccountList.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-external-account-id]");
        if (!button) {
          return;
        }
        const mappingId = button.dataset.externalAccountId;
        if (!mappingId) {
          return;
        }
        try {
          await api(`/api/user/external-accounts/${encodeURIComponent(mappingId)}`, {
            method: "DELETE",
          });
          await refresh();
          showToast("External account unbound.", "success");
        } catch (error) {
          showToast(error.message || "Failed to unbind external account.", "warning");
        }
      });

      refresh();
    })();
  </script>
  <style>
    .profile-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .ticket-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgb(15 23 42 / 45%);
    }

    .ticket-modal-backdrop[hidden] {
      display: none;
    }

    .ticket-modal {
      width: min(560px, 100%);
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .ticket-field {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .ticket-field input {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .external-account-form {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
  </style>
</body>
</html>
