version: 2

updates:
  # Root Python package (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"

  # Root JS tooling (docs build + shared devDependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"

  # OpenClaw adapter plugin package
  - package-ecosystem: "npm"
    directory: "/src/client/js/agentguard/adapters/agent/openclaw-adapter-js/agentguard-plugin"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"

  # GitHub Actions workflows — grouped into a single PR per update cycle so
  # a fresh dependabot.yml doesn't open a flood of one-action-per-PR noise.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"

  # Docker base images. Major-version bumps (e.g. a new Python minor/major
  # release like 3.11 -> 3.14) are intentionally excluded: those need a
  # manual compatibility check (native deps, wheel availability) rather than
  # an auto-generated PR. Patch/minor updates on the pinned line still flow
  # through normally.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"
